name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5'

      # --edge installs the rolling build of beamtalk main, needed for ADR 0135
      # (instance-side supervisor configuration). Go back to --nightly once
      # nightlies publish again (BT-3980).
      - name: Install beamtalk
        run: |
          curl -fsSL https://beamtalk.dev/install.sh | sudo sh -s -- --edge --prefix /usr/local
          beamtalk --version

      - name: Format check
        run: beamtalk fmt-check

      - name: Lint
        run: beamtalk lint
        continue-on-error: true

      - name: Build
        run: beamtalk build

      - name: Test
        run: beamtalk test
